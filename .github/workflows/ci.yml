name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install C++ toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ cmake make

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build C++
        run: make cpp

      - name: Build Java
        run: make java

      - name: Install Python package + pytest
        run: |
          python -m pip install -U pip
          python -m pip install -e "./python[dev]"

      - name: Cross-engine pytest
        run: python -m pytest python/tests -v

      - name: Demo alignment
        run: make demo
