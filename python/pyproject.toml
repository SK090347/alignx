[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alignx"
version = "0.1.0"
description = "Smith-Waterman local alignment — Python CLI and cross-checks for alignx"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sumit Kumar Ta" }]
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
alignx-py = "alignx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["alignx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
